<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touchbase AI</title>
    <script>
      // Apply the stored light theme before paint so the dashboard does not flash dark.
      // Only the dashboard overview supports the light theme for now (see src/lib/appTheme.ts).
      try {
        if (
          location.pathname.replace(/\/+$/, "") === "/dashboard" &&
          localStorage.getItem("touchbase-theme") === "light"
        ) {
          document.documentElement.dataset.theme = "light";
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
